<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillScope · 纯聊天模式</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>
:root{
  --ga:#FBF7EC;--gb:#F4EEDA;--surface:#FFFDF7;--s2:#F6F1E2;
  --ink:#1C1813;--ink2:#574F42;--ink3:#7C7364;--rule:#E4DCC7;--rule2:#D2C8AE;
  --acc:#7A5218;--acc2:#97671F;--accs:#F5E9CE;--accl:#D9BE86;--onacc:#FFFDF7;
  --sans:"IBM Plex Sans","Noto Sans SC",-apple-system,"PingFang SC",sans-serif;
  --mono:"IBM Plex Mono","Noto Sans SC",ui-monospace,Menlo,monospace;
  --sh:0 1px 2px rgba(60,45,20,.05),0 10px 26px -18px rgba(60,45,20,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ga:#14110B;--gb:#1A160F;--surface:#1D1913;--s2:#252019;
  --ink:#EDE6D6;--ink2:#B3A995;--ink3:#918878;--rule:#332D23;--rule2:#463E30;
  --acc:#D9AE62;--acc2:#C69B4E;--accs:#2A2115;--accl:#5C4A2C;--onacc:#14110B;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 26px -18px rgba(0,0,0,.8);
}}
*{box-sizing:border-box}html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  background:linear-gradient(155deg,var(--ga) 0%,var(--ga) 38%,var(--gb) 100%)}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:5px}

#app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:0 20px;height:46px;flex-shrink:0;
  border-bottom:1px solid var(--rule)}
.nm{font-size:14px;font-weight:600}
.mn{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.grow{flex:1}
.mode{display:inline-flex;align-items:center;justify-content:center;padding:4px 10px;
  border:1px solid var(--rule2);border-radius:6px;background:var(--surface);color:var(--ink2);
  font-size:11.5px;font-weight:500;text-decoration:none;white-space:nowrap;transition:all .14s}
.mode:hover{border-color:var(--acc);color:var(--acc);background:var(--accs)}
.tasklink{align-self:flex-start;margin-left:4px}

.log{flex:1;overflow-y:auto;min-height:0}
.inner{max-width:720px;margin:0 auto;padding:26px 22px 20px;display:flex;
  flex-direction:column;gap:16px}
.msg{max-width:82%;padding:11px 15px;border-radius:12px;line-height:1.68;
  animation:in .28s cubic-bezier(.2,.9,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;background:var(--accs);border:1px solid var(--accl)}
.msg.it{align-self:flex-start;background:var(--surface);border:1px solid var(--rule);
  box-shadow:var(--sh)}
.msg .md-p+.md-p{margin-top:7px}.msg .md-h{font-weight:600;margin:7px 0 2px}
.msg .md-h:first-child{margin-top:0}.msg ul{margin:6px 0;padding-left:20px}
.msg li+li{margin-top:3px}.msg code{font-family:var(--mono);font-size:12px;padding:1px 4px;
  border-radius:4px;background:var(--s2);color:var(--acc)}
.skill-card{align-self:stretch;max-width:100%;padding:0;overflow:hidden}
.skill-card summary{display:flex;align-items:center;gap:9px;padding:11px 15px;cursor:pointer;
  font-weight:600;list-style:none}.skill-card summary::-webkit-details-marker{display:none}
.skill-card summary:after{content:"展开";margin-left:auto;font-family:var(--mono);font-size:10px;
  font-weight:400;color:var(--ink3)}.skill-card[open] summary:after{content:"收起"}
.skill-card-body{padding:0 15px 14px;border-top:1px solid var(--rule)}
.skill-version{font-family:var(--mono);font-size:10px;color:var(--ink3);font-weight:400}
.skill-instructions{display:flex;flex-direction:column;margin-top:4px}
.skill-instruction{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:9px 0;
  border-bottom:1px solid var(--rule);font-size:12.5px;line-height:1.62}
.skill-instruction:last-child{border-bottom:0}.skill-n{font-family:var(--mono);font-size:10px;
  color:var(--acc);padding-top:2px}.skill-tools{margin-top:11px;font-size:11.5px;color:var(--ink3)}
.act{align-self:flex-start;font-family:var(--mono);font-size:10.5px;color:var(--ink3);
  padding:0 4px}
.empty{text-align:center;color:var(--ink3);padding:70px 0;font-size:13.5px}
.picker{align-self:stretch;display:flex;flex-direction:column;gap:9px;max-width:520px;
  width:100%;margin:42px auto 0}
.picktitle{text-align:center;font-size:15px;font-weight:600;margin-bottom:5px}
.pick{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--rule2);
  border-radius:10px;padding:11px 14px;background:var(--surface);box-shadow:var(--sh)}
.pick:hover{border-color:var(--acc)}.pick small{color:var(--ink3)}
.work-order-layer:empty{display:none}
.work-order-overlay{position:fixed;inset:0;z-index:140;display:flex;align-items:center;
  justify-content:center;padding:24px;background:rgba(18,21,25,.42);backdrop-filter:blur(3px)}
.work-order-dialog{width:min(680px,100%);max-height:calc(100vh - 48px);overflow-y:auto;
  border:1px solid var(--rule2);border-radius:15px;background:var(--surface);
  box-shadow:0 26px 70px rgba(18,21,25,.26)}
.work-order-head{display:flex;align-items:flex-start;gap:14px;padding:22px 24px 18px;
  border-bottom:1px solid var(--rule)}
.work-order-head .copy{min-width:0;flex:1}.work-order-kicker{font-family:var(--mono);
  font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin-bottom:7px}
.work-order-head h1{font-size:21px;line-height:1.3;letter-spacing:-.025em;margin:0}
.work-order-body{padding:20px 24px 23px}.work-order-role{font-size:13.5px;font-weight:500;
  line-height:1.6;margin-bottom:17px}.work-order-section{display:grid;
  grid-template-columns:92px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--rule)}
.work-order-section .label{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  color:var(--ink3);padding-top:2px}.work-order-section .value{font-size:13px;line-height:1.7;color:var(--ink2)}
.work-order-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.work-order-meta span{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:5px;
  border:1px solid var(--rule2);color:var(--ink3);background:var(--s2)}
.work-order-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:20px}
.wo-btn{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:7px;
  border:1px solid var(--rule2);background:var(--surface);font-size:12px;font-weight:500}
.wo-btn.primary{border-color:var(--acc);background:var(--acc);color:var(--onacc)}
.wo-close{font-size:19px;line-height:1;color:var(--ink3);padding:3px 6px}
.skill-layer:empty{display:none}.skill-overlay{position:fixed;inset:0;z-index:150;
  background:rgba(18,21,25,.38);backdrop-filter:blur(2px)}
.skill-drawer{position:absolute;top:0;right:0;width:min(500px,calc(100vw - 24px));height:100%;
  display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--rule2);
  box-shadow:-20px 0 55px rgba(18,21,25,.2);animation:drawer-in .22s ease-out}
@keyframes drawer-in{from{transform:translateX(18px);opacity:.45}to{transform:none;opacity:1}}
.skill-drawer-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 16px;
  border-bottom:1px solid var(--rule)}.skill-drawer-head .copy{min-width:0;flex:1}
.skill-drawer-head h1{font-size:19px;line-height:1.35;margin:0 0 3px}.skill-drawer-note{
  font-size:11.5px;color:var(--ink3)}.skill-close{font-size:20px;line-height:1;color:var(--ink3);
  padding:3px 6px}.skill-drawer-body{overflow-y:auto;padding:12px 22px 24px}
.repair-check{padding:0;overflow:hidden}.repair-check>summary{display:flex;align-items:center;
  gap:8px;padding:12px 14px;cursor:pointer;list-style:none;font-size:12px;font-weight:600}
.repair-check>summary::-webkit-details-marker{display:none}.repair-check>summary:after{content:'›';
  margin-left:auto;color:var(--ink3);transition:transform .18s}.repair-check[open]>summary:after{
  transform:rotate(90deg)}.repair-check-body{border-top:1px solid var(--rule);padding:12px 14px;
  background:var(--s2)}.repair-rule{border-left:3px solid var(--acc);padding:7px 9px;
  margin:8px 0;background:var(--surface);border-radius:0 6px 6px 0;font-size:12px;
  line-height:1.55;color:var(--ink2)}.repair-method{border:1px solid var(--rule);
  border-radius:7px;background:var(--surface);padding:9px 10px;margin-top:8px;font-size:11.5px;
  line-height:1.55}.repair-method-head{display:flex;align-items:center;gap:7px;font-weight:600}
.repair-method-result{color:var(--ink3);margin-top:4px}.repair-method-outcomes{margin-top:6px;
  color:var(--ink2)}.repair-audit-meta{font-size:10.5px;line-height:1.55;color:var(--ink3)}

.foot{flex-shrink:0;border-top:1px solid var(--rule);background:var(--surface)}
.footin{max-width:720px;margin:0 auto;padding:11px 22px 16px}
.box{display:flex;gap:9px;align-items:flex-end;border:1px solid var(--rule2);border-radius:12px;
  padding:9px 10px 9px 14px;background:var(--ga);transition:border-color .15s,box-shadow .15s}
.box:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
.box textarea{flex:1;border:0;background:transparent;resize:none;outline:none;font-size:14.5px;
  line-height:1.6;min-height:26px;max-height:120px}
.go{width:31px;height:31px;border-radius:8px;background:var(--acc);color:var(--onacc);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.go[disabled]{opacity:.3;cursor:not-allowed}
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink3);
  margin-right:3px;animation:b 1.1s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (max-width:620px){.top{padding:0 10px;gap:6px}.top .mn:last-of-type{display:none}
  .mode{padding:4px 8px}.work-order-overlay{padding:12px}.work-order-head,.work-order-body{
  padding-left:17px;padding-right:17px}.work-order-section{grid-template-columns:1fr;gap:4px}
  .work-order-actions{align-items:stretch;flex-direction:column}.wo-btn{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app">
  <div class="top">
    <span class="nm" id="nm">—</span>
    <span class="mn" id="ver"></span>
    <span class="grow"></span>
    <span class="mn">纯聊天模式</span>
    <button class="mode" id="scenarioButton" hidden>切换工作流</button>
    <button class="mode" id="workOrderButton" hidden>评审工单</button>
    <button class="mode" id="skillButton" hidden>查看 Skill</button>
    <a class="mode" id="modeSwitch" href="/" title="保留当前评审，切换到结构化工作区">结构化工作区</a>
    <button class="mode" id="reset" title="清空本轮评审并返回工作流选择">重置</button>
  </div>
  <div class="log" id="log"><div class="inner" id="inner"></div></div>
  <div class="foot"><div class="footin">
    <div class="box"><textarea id="ta" rows="1" placeholder="这类情况以后应当怎样处理？"></textarea>
      <button class="go" id="go">↑</button></div>
  </div></div>
</div>
<div id="workOrderLayer" class="work-order-layer"></div>
<div id="skillLayer" class="skill-layer"></div>
<script>
(function(){"use strict";
function h(t,a,k){var e=document.createElement(t);
  if(a)for(var n in a){var v=a[n];if(v==null||v===false)continue;
    if(n==="class")e.className=v;else if(n.slice(0,2)==="on")e.addEventListener(n.slice(2),v);
    else e.setAttribute(n,v);}
  (k||[]).forEach(function(c){if(c==null)return;
    e.appendChild(typeof c==="string"?document.createTextNode(c):c);});return e;}
function clr(e){while(e.firstChild)e.removeChild(e.firstChild);}
var $=function(i){return document.getElementById(i);};
var hist=[],busy=false,scenarios=[],currentWorkOrder=null,pendingScenario=null,currentSkill=null,
  currentCandidate=null;
var SESSION=sessionStorage.getItem("skillscope-session");
if(!SESSION){SESSION="ss-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
  sessionStorage.setItem("skillscope-session",SESSION);}
var modeSwitch=$("modeSwitch"),modeParams=new URLSearchParams(location.search);
var FORMAL=modeParams.get("study")==="1";
var ASSIGNED_SCENARIO=(modeParams.get("scenario")||"").trim();
var STUDY_META={session:SESSION,participant:(modeParams.get("participant")||"").slice(0,80),
  condition:"chat",period:(modeParams.get("period")||"").slice(0,24),formal:FORMAL};
function track(name,data){
  var detail={},key;data=data||{};for(key in data)detail[key]=data[key];
  detail.study={participant:STUDY_META.participant,condition:"chat",period:STUDY_META.period,
    formal:FORMAL,scenario_id:(currentWorkOrder||{}).scenario_id||ASSIGNED_SCENARIO||null,
    task_id:(currentWorkOrder||{}).id||null,task_hash:(currentWorkOrder||{}).task_hash||null};
  fetch("/api/event",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({session:SESSION,name:name,data:detail,at:Date.now()}),keepalive:true}).catch(function(){});
}
if(modeSwitch){
  modeSwitch.href="/"+location.search;
  if(FORMAL||modeParams.get("lockMode")==="1")modeSwitch.hidden=true;
  modeSwitch.addEventListener("click",function(){
    track("mode_switched",{from:"chat",to:"workspace"});
  });
}
if(FORMAL||modeParams.get("lockMode")==="1"){
  $("reset").hidden=true;$("scenarioButton").hidden=true;
}
$("skillButton").addEventListener("click",showSkillDrawer);
$("reset").addEventListener("click",resetChat);

function markdownInline(text){
  var out=[],source=String(text||""),re=/(\*\*[^*]+\*\*|`[^`]+`)/g,last=0,match;
  while((match=re.exec(source))){
    if(match.index>last)out.push(source.slice(last,match.index));
    if(match[0].slice(0,2)==="**")out.push(h("strong",{},[match[0].slice(2,-2)]));
    else out.push(h("code",{},[match[0].slice(1,-1)]));
    last=re.lastIndex;
  }
  if(last<source.length)out.push(source.slice(last));return out;
}
function messageBody(text){
  var box=h("div"),list=null;
  String(text||"").replace(/\r/g,"").split("\n").forEach(function(line){
    if(!line.trim()){list=null;return;}
    var bullet=line.match(/^\s*[-*]\s+(.+)$/),heading=line.match(/^#{1,3}\s+(.+)$/);
    if(bullet){if(!list){list=h("ul");box.appendChild(list);}
      list.appendChild(h("li",{},markdownInline(bullet[1])));return;}
    list=null;box.appendChild(h("div",{class:heading?"md-h":"md-p"},
      markdownInline(heading?heading[1]:line)));
  });
  return box;
}
function add(cls,txt){
  var el=h("div",{class:"msg "+cls},[messageBody(txt)]);
  $("inner").appendChild(el);scroll();return el;}
function note(txt){$("inner").appendChild(h("div",{class:"act"},[txt]));scroll();}
function scroll(){var l=$("log");setTimeout(function(){
  if(l.scrollTo)l.scrollTo({top:l.scrollHeight,behavior:"smooth"});else l.scrollTop=l.scrollHeight;
},40);}
function skillDocument(skill){
  var body=h("div",{class:"skill-instructions"});
  (skill.instructions||[]).forEach(function(row){body.appendChild(h("div",{class:"skill-instruction"},[
    h("span",{class:"skill-n"},[String(row.n).padStart(2,"0")]),h("span",{},[row.text]) ]));});
  var tools=(skill.tools||[]).map(function(row){
    return (row.name||row.label||"")+(row.signature||"");}).filter(Boolean);
  return h("div",{class:"skill-card-body"},[body,tools.length?h("div",{class:"skill-tools"},[
    "可用工具："+tools.join(" · ")]):null]);
}
function appendSkillMessage(skill,expanded){
  if(!skill||!(skill.instructions||[]).length)return;
  var card=h("details",{class:"msg it skill-card",open:expanded?"":null},[
    h("summary",{},["当前发布版 Skill",h("span",{class:"skill-version"},[
      (skill.name||"Skill")+" · v"+(skill.version||1)])]),skillDocument(skill)]);
  $("inner").appendChild(card);scroll();
}
function appendCandidateMessage(candidate,expanded){
  if(!candidate||!(candidate.instructions||[]).length)return;
  currentCandidate=candidate;
  var card=h("details",{class:"msg it skill-card",open:expanded?"":null},[
    h("summary",{},["完整候选 Skill",h("span",{class:"skill-version"},[
      (candidate.name||"Skill")+" · v"+(candidate.version||"—")])]),skillDocument(candidate)]);
  $("inner").appendChild(card);scroll();
}
function appendRepairCheckDetails(preview){
  if(!preview||!preview.id||$("inner").querySelector('[data-repair-preview="'+preview.id+'"]'))return;
  var body=h("div",{class:"repair-check-body"},[
    h("div",{class:"repair-audit-meta"},[
      "检查情况："+(preview.case_summary||preview.case_id||"当前问题")]),
    h("div",{class:"repair-rule"},["第 "+preview.instruction+" 条："+(preview.instruction_text||"")]),
    preview.question?h("div",{class:"repair-audit-meta"},["检查问题："+preview.question]):null]);
  (preview.evidence||[]).forEach(function(row){
    var label=row.kind==="delete"?"不应用这条规则":
      row.kind==="invert"?"采用相反处理原则":"改变输入条件";
    var rewrite=((((row.intervention||{}).rewrite)||{}).text)||"";
    var result=row.changed===true?"处理结果发生变化":
      row.changed===false?"未观察到稳定变化":"结果仍不确定";
    var method=h("div",{class:"repair-method"},[
      h("div",{class:"repair-method-head"},[h("span",{},[label]),
        h("span",{class:"skill-version"},[((row.intervention_run_ids||[]).length||3)+" 次复核"])]),
      rewrite?h("div",{class:"repair-rule"},[rewrite]):null,
      h("div",{class:"repair-method-result"},[result+
        ((row.changed_field_labels||[]).length?" · "+row.changed_field_labels.join("、"):"")]),
      row.baseline_outcome&&row.intervention_outcome?h("div",{class:"repair-method-outcomes"},[
        "原规则："+row.baseline_outcome+" → 检查后："+row.intervention_outcome]):null]);
    body.appendChild(method);
  });
  var budget=preview.run_budget||{};
  body.appendChild(h("div",{class:"repair-audit-meta",style:"margin-top:8px"},[
    "所有检查使用相同输入、工具数据和模型配置。每种方式复核 "+
    (budget.runs_per_intervention||3)+" 次。"]));
  var details=h("details",{class:"msg it repair-check","data-repair-preview":preview.id},[
    h("summary",{},["查看系统如何判断",h("span",{class:"skill-version"},["检查详情"])]),body]);
  details.addEventListener("toggle",function(){if(details.open)track("source_location_details_opened",{
    preview_id:preview.id,instruction:preview.instruction});});
  $("inner").appendChild(details);scroll();
}
function closeSkillDrawer(){var layer=$("skillLayer");if(layer)clr(layer);}
function showSkillDrawer(){
  if(!currentSkill)return;
  var layer=$("skillLayer");clr(layer);
  var drawer=h("aside",{class:"skill-drawer",role:"dialog","aria-modal":"true",
    "aria-label":"当前发布版 Skill"},[
    h("div",{class:"skill-drawer-head"},[
      h("div",{class:"copy"},[h("h1",{},[currentSkill.name||"当前 Skill"]),
        h("div",{class:"skill-drawer-note"},["发布版 v"+(currentSkill.version||1)+
          " · 只读原文，关闭后继续当前对话"])]),
      h("button",{class:"skill-close",title:"关闭","aria-label":"关闭 Skill 原文",
        onclick:closeSkillDrawer},["×"])]),
    h("div",{class:"skill-drawer-body"},[skillDocument(currentSkill)])]);
  drawer.addEventListener("click",function(e){e.stopPropagation();});
  var overlay=h("div",{class:"skill-overlay",onclick:function(e){
    if(e.target===overlay)closeSkillDrawer();}},[drawer]);
  layer.appendChild(overlay);track("chat_skill_viewed",{version:currentSkill.version||1});
  setTimeout(function(){var button=drawer.querySelector(".skill-close");if(button)button.focus();},0);
}
function progressText(progress){
  if(!progress)return "";
  return progress.next_action||"";
}

function scenarioById(id){return scenarios.filter(function(row){return row.id===id;})[0]||null;}
function formalAssignmentProblem(st){
  if(!FORMAL)return "";
  if(!ASSIGNED_SCENARIO||!STUDY_META.participant||!STUDY_META.period)
    return "正式任务链接不完整，缺少 scenario、participant 或 period。请联系研究人员获取本轮专用链接。";
  var assigned=scenarioById(ASSIGNED_SCENARIO);
  if(!assigned)return "正式任务链接中的 scenario 无效。请联系研究人员获取正确链接。";
  if(!st||!st.active)return "";
  var ctx=st.study_context||{},order=assigned.work_order||{},current=st.work_order||{};
  if(st.skill.scenario_id!==ASSIGNED_SCENARIO||ctx.formal!==true||
      ctx.participant!==STUDY_META.participant||ctx.condition!=="chat"||
      ctx.period!==STUDY_META.period||ctx.scenario_id!==ASSIGNED_SCENARIO||
      ctx.task_hash!==order.task_hash||current.task_hash!==order.task_hash)
    return "当前实例已属于另一位参与者、实验条件或任务轮次。请联系研究人员更换隔离实例。";
  return "";
}
function closeWorkOrder(force){
  if(!force&&FORMAL&&!$("nm").textContent.match(/[^—]/)&&pendingScenario)return;
  pendingScenario=null;var layer=$("workOrderLayer");if(layer)clr(layer);
}
function showWorkOrder(scenario,canStart){
  if(!scenario||!scenario.work_order)return;
  pendingScenario=canStart?scenario:null;
  var order=scenario.work_order;if(!canStart)currentWorkOrder=order;
  $("workOrderButton").hidden=false;
  var layer=$("workOrderLayer");clr(layer);
  function section(label,value){return h("div",{class:"work-order-section"},[
    h("div",{class:"label"},[label]),h("div",{class:"value"},[value])]);}
  var closeAllowed=!canStart||!FORMAL;
  var head=h("div",{class:"work-order-head"},[
    h("div",{class:"copy"},[h("div",{class:"work-order-kicker"},[order.label||"评审工单"]),
      h("h1",{},[order.title])]),
    closeAllowed?h("button",{class:"wo-close",title:"关闭","aria-label":"关闭评审工单",
      onclick:function(){closeWorkOrder(false);}},["×"]):null]);
  var actions=[];
  if(canStart){
    if(!FORMAL)actions.push(h("button",{class:"wo-btn",onclick:function(){closeWorkOrder(false);}},["返回选择"]));
    actions.push(h("button",{class:"wo-btn primary",onclick:function(){
      var selected=pendingScenario;if(!selected)return;closeWorkOrder(true);
      currentWorkOrder=selected.work_order;startScenario(selected.id);}},["接受工单并开始评审"]));
  }else actions.push(h("button",{class:"wo-btn primary",onclick:function(){closeWorkOrder(true);}},["返回评审"]));
  var body=h("div",{class:"work-order-body"},[
    h("div",{class:"work-order-role"},[order.role]),
    section("事件背景",order.context),section("你的目标",order.objective),
    section("完成条件",order.completion),
    (order.review_steps||[]).length?section("处理流程",order.review_steps.map(function(step,index){
      return (index+1)+". "+step;}).join("　→　")):null,
    h("div",{class:"work-order-meta"},[
      h("span",{},[(FORMAL?"本轮时限 ":"建议用时 ")+order.time_minutes+" 分钟"]),
      h("span",{},[order.environment_note])]),
    h("div",{class:"work-order-actions"},actions)]);
  var dialog=h("section",{class:"work-order-dialog",role:"dialog","aria-modal":"true",
    "aria-label":order.title},[head,body]);
  dialog.addEventListener("click",function(e){e.stopPropagation();});
  var overlay=h("div",{class:"work-order-overlay",onclick:function(e){
    if(e.target===overlay)closeWorkOrder(false);}},[dialog]);layer.appendChild(overlay);
  setTimeout(function(){var button=dialog.querySelector(".primary");if(button)button.focus();},0);
  if(!canStart)track("work_order_viewed",{source:"topbar"});
}
function showScenarioPicker(){
  if(FORMAL||modeParams.get("lockMode")==="1"||busy)return;
  catalogPromise.then(function(){
    var layer=$("workOrderLayer");clr(layer);
    var list=h("div",{class:"picker"},[]);
    scenarios.forEach(function(s){list.appendChild(h("button",{class:"pick",onclick:function(){
      clr(layer);showWorkOrder(s,true);}},[h("span",{},[s.title]),h("small",{},[
        s.description+" · "+s.instruction_count+" 条指令 · "+s.tool_count+" 个工具"])]));});
    var dialog=h("section",{class:"work-order-dialog",role:"dialog","aria-modal":"true",
      "aria-label":"切换工作流"},[
      h("div",{class:"work-order-head"},[h("div",{class:"copy"},[
        h("div",{class:"work-order-kicker"},["工作流"]),h("h1",{},["切换工作流"])]),
        h("button",{class:"wo-close",title:"关闭","aria-label":"关闭工作流选择",
          onclick:function(){clr(layer);}},["×"])]),
      h("div",{class:"work-order-body"},[list])]);
    dialog.addEventListener("click",function(e){e.stopPropagation();});
    var overlay=h("div",{class:"work-order-overlay",onclick:function(e){
      if(e.target===overlay)clr(layer);}},[dialog]);layer.appendChild(overlay);
    track("scenario_switch_opened",{from:(currentSkill||{}).scenario_id||null});
  });
}
$("scenarioButton").addEventListener("click",showScenarioPicker);
$("workOrderButton").addEventListener("click",function(){
  catalogPromise.then(function(){
    var scenario=scenarioById((currentWorkOrder||{}).scenario_id||ASSIGNED_SCENARIO);
    if(scenario)showWorkOrder(scenario,false);
  });
});

var CAPNAME={run_task:"执行任务",show_options:"取出候选项",check_instruction:"检验指令",
  check_candidate_block:"检查候选改动",
  check_data:"检验数据",suggest_cases:"查找相关情况",open_case:"执行相关情况",
  record_expectation:"记录预期",draft:"起草修改",edit_instruction:"直接修改指令",
  prepare_cases:"检查相关情况",prepare_case:"检查相关情况",compare:"对比改前改后",
  source_preview:"整理相关修改依据",reopen_scope:"开始新的范围评审轮",
  decide:"记录决定",list_instructions:"读取指令",none:""};

var DISPOSITION={change:"需要改变",preserve:"必须保留",unresolved:"待决边界",
  excluded:"不纳入本轮"};
function bootstrapText(data){
  var lines=["**继续当前评审**",(data.skill.name||"当前 skill")+" · v"+data.skill.version];
  if(data.work_order){
    lines.push("**评审目标** "+data.work_order.objective);
    lines.push("**完成条件** "+data.work_order.completion);
  }
  var incident=data.incident;
  if(incident){
    lines.push("**历史事件** "+(incident.summary||incident.task||"已载入的历史情况"));
    if(incident.issue){
      lines.push("**原版本暴露的问题** "+incident.issue.issue_title+"。"+incident.issue.issue_detail);
    }else if(incident.outcome){
      lines.push("**原版本执行结果** "+incident.outcome);
    }
  }
  if((data.scope||[]).length){
    lines.push("**已记录的修复范围（"+data.scope.length+" 项）**");
    data.scope.forEach(function(row){lines.push("- "+(DISPOSITION[row.disposition]||"已记录")+" · "+
      (row.case_summary||"相关情况")+"："+row.commitment);});
  }
  if(data.candidate)lines.push("**候选状态** 已有 v"+data.candidate.version+" 候选修改，作者为 "+
    (data.candidate.author==="owner"?"你":"AI")+"。");
  if(data.terminal){
    lines.push(data.terminal.action==="publish"?"**当前状态** 新版本已经发布，本轮证据和决定已保存。":
      "**当前状态** 本轮修改已暂缓，现有版本保持不变。");
  }
  lines.push(progressText(data.progress||{next_action:data.next_action}));
  return lines.join("\n\n");
}
function appendQuestionnaire(terminal){
  if(!terminal||terminal.questionnaire_completed)return;
  $("inner").appendChild(h("a",{class:"mode tasklink",href:terminal.questionnaire_path||"/questionnaire"},
    ["完成任务问卷"]));scroll();
}

function send(){
  var ta=$("ta"),txt=(ta.value||"").trim();
  if(!txt||busy)return;
  ta.value="";ta.style.height="auto";
  add("me",txt);hist.push({role:"user",text:txt});
  busy=true;$("go").disabled=true;$("reset").disabled=true;
  var wait=h("div",{class:"msg it"},[h("span",{class:"dots"},
    [h("span"),h("span"),h("span")])]);
  $("inner").appendChild(wait);scroll();
  fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:txt,history:hist,session:SESSION})})
   .then(function(r){
     var rd=r.body.getReader(),dec=new TextDecoder(),buf="";
     return (function pump(){return rd.read().then(function(res){
       if(res.done)return;
       buf+=dec.decode(res.value,{stream:true});
       var ps=buf.split("\n");buf=ps.pop();
       ps.forEach(function(l){if(!l.trim())return;var m;
         try{m=JSON.parse(l);}catch(e){return;}
         if(m.type==="act"){
           var n=CAPNAME[m.capability];
           if(n||m.label)note((m.label||n)+"…");
         }else if(m.type==="candidate"){
           appendCandidateMessage(m.candidate,false);
         }else if(m.type==="text"){
           if(wait.parentNode)wait.remove();
           add("it",m.text);hist.push({role:"assistant",text:m.text});
         }else if(m.type==="task_complete"){
           $("inner").appendChild(h("a",{class:"mode",href:m.path},["完成任务问卷"]));scroll();
         }});
       return pump();});})();
   })
   .catch(function(e){if(wait.parentNode)wait.remove();
     add("it","出错了："+e);})
   .then(function(){
     busy=false;$("go").disabled=false;$("reset").disabled=false;$("ta").focus();
     fetch("/api/chat/bootstrap?session="+encodeURIComponent(SESSION)).then(function(r){return r.json();}).then(function(st){
       if(st.skill){currentSkill=st.skill;$("skillButton").hidden=false;
         $("nm").textContent=st.skill.name;$("ver").textContent="v"+st.skill.version;}
       currentCandidate=st.candidate||currentCandidate;
       if(st.repair_preview)
         appendRepairCheckDetails(st.repair_preview);
     }).catch(function(){});
   });
}

function resetChat(){
  if(busy)return;
  var button=$("reset");busy=true;button.disabled=true;button.textContent="正在重置";
  fetch("/api/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})
    .then(function(r){return r.json();}).then(function(d){
      if(d.error)throw new Error(d.error);
      closeSkillDrawer();currentSkill=null;$("skillButton").hidden=true;
      location.reload();
    }).catch(function(e){busy=false;button.disabled=false;button.textContent="重置";
      add("it","重置失败："+String(e.message||e));});
}

$("go").addEventListener("click",send);
$("ta").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
$("ta").addEventListener("input",function(){this.style.height="auto";
  this.style.height=Math.min(120,this.scrollHeight)+"px";});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&$("skillLayer").firstChild){e.preventDefault();closeSkillDrawer();return;}
  if(e.key==="Escape"&&$("workOrderLayer").firstChild){e.preventDefault();closeWorkOrder(false);}
});

function startScenario(id,options){
  if(busy)return;options=options||{};busy=true;hist=[];$("go").disabled=true;
  $("reset").disabled=true;clr($("inner"));
  var wait=add("it","正在载入历史事件…");
  fetch("/api/scenario/load",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id:id,study:{session:SESSION,participant:STUDY_META.participant,
      condition:"chat",period:STUDY_META.period,formal:FORMAL},reuse:!FORMAL})}).then(function(r){return r.json();}).then(function(d){
      if(d.error)throw new Error(d.error);
      currentWorkOrder=d.work_order||currentWorkOrder;$("workOrderButton").hidden=!currentWorkOrder;
      currentSkill=d.skill;$("skillButton").hidden=false;
      if(!FORMAL&&modeParams.get("lockMode")!=="1")$("scenarioButton").hidden=false;
      $("nm").textContent=d.skill.name;$("ver").textContent="v"+d.skill.version;
      if(options.accepted!==false)track(d.restored?"scenario_resumed":"work_order_accepted",{scenario_id:id,
        task_id:(currentWorkOrder||{}).id||null,task_hash:(currentWorkOrder||{}).task_hash||null});
      track("chat_scenario_loaded",{scenario:id,reset:!!options.reset});
      if(d.restored)return {restored:true};
      return fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({snapshot:d.snapshot.id,k:3})}).then(function(r){
          var rd=r.body.getReader(),dec=new TextDecoder(),buf="",first=null,done=null;
          return (function pump(){return rd.read().then(function(x){
            if(x.done)return {first:first,done:done,snapshot:d.snapshot};
            buf+=dec.decode(x.value,{stream:true});var lines=buf.split("\n");buf=lines.pop();
            lines.forEach(function(line){if(!line.trim())return;var m=JSON.parse(line);
              if(m.type==="run"&&!first)first=m.run;if(m.type==="done")done=m;});
            return pump();});})();});
    }).then(function(x){
      if(x.restored)return x;
      return fetch("/api/issue",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({snapshot:x.snapshot.id})}).then(function(r){return r.json();})
        .then(function(d){x.issue=d.issue||null;return x;})
        .catch(function(){return x;});
    }).then(function(x){
      if(x.restored)return x;
      return fetch("/api/chat/bootstrap?session="+encodeURIComponent(SESSION)).then(function(r){return r.json();})
        .then(function(st){x.progress=st.progress||null;return x;}).catch(function(){return x;});
    }).then(function(x){
      if(x.restored){location.reload();return;}
      if(wait.parentNode)wait.remove();
      appendSkillMessage(currentSkill,true);
      var txt="**历史事件** "+(x.snapshot.summary||x.snapshot.task)+"。\n\n**原处理结果** "+
        (x.first&&x.first.outcome?x.first.outcome:"没有可用结果。");
      if(x.issue)txt+="\n\n**需要处理的问题：**"+x.issue.issue_title+"。"+
        x.issue.issue_detail+"\n\n"+x.issue.question;
      else if(x.progress)txt+="\n\n"+progressText(x.progress);
      add("it",txt);hist.push({role:"assistant",text:txt});
    }).catch(function(e){if(wait.parentNode)wait.remove();add("it","载入失败："+String(e.message||e));})
      .then(function(){busy=false;$("go").disabled=false;$("reset").disabled=false;
        $("reset").textContent="重置";$("ta").focus();});
}
var catalogPromise=fetch("/api/scenarios").then(function(r){return r.json();}).then(function(d){
  scenarios=d.scenarios||[];return d;
});
function renderPicker(){
  catalogPromise.then(function(d){
    scenarios=d.scenarios||[];
    if(FORMAL){
      var assigned=scenarioById(ASSIGNED_SCENARIO);
      if(!assigned){add("it","正式任务链接缺少有效的 scenario 参数，请联系研究人员。");return;}
      add("it","评审工单已经分配。请先阅读角色、目标和完成条件，再开始处理历史事件。");
      showWorkOrder(assigned,true);return;
    }
    var box=h("div",{class:"picker"},[h("div",{class:"picktitle"},["选择要评审的工作流"])]);
    scenarios.forEach(function(s){box.appendChild(h("button",{class:"pick",
      onclick:function(){showWorkOrder(s,true);}},[h("span",{},[s.title]),
      h("small",{},[s.description+" · "+s.instruction_count+" 条指令 · "+s.tool_count+" 个工具"])]));});
    $("inner").appendChild(box);
  }).catch(function(err){add("it","工作流列表加载失败："+String(err.message||err));});
}
var opening=add("it","正在恢复当前评审…");
var bootstrapPromise=fetch("/api/chat/bootstrap?session="+encodeURIComponent(SESSION)).then(function(r){
  return r.json().then(function(data){if(!r.ok)throw new Error(data.error||"恢复失败");return data;});
});
Promise.all([catalogPromise,bootstrapPromise]).then(function(values){
  var st=values[1];
  if(opening.parentNode)opening.remove();
  var formalProblem=formalAssignmentProblem(st);
  if(formalProblem){
    add("it",formalProblem);$("ta").disabled=true;$("go").disabled=true;return;
  }
  if(st.active){
    currentWorkOrder=st.work_order||null;$("workOrderButton").hidden=!currentWorkOrder;
    currentSkill=st.skill;$("skillButton").hidden=false;
    if(!FORMAL&&modeParams.get("lockMode")!=="1")$("scenarioButton").hidden=false;
    $("nm").textContent=st.skill.name;$("ver").textContent="v"+st.skill.version;
    add("it",bootstrapText(st));hist.push({role:"assistant",text:bootstrapText(st)});
    appendSkillMessage(currentSkill,false);
    (st.messages||[]).forEach(function(row){
      add("me",row.message||"");hist.push({role:"user",text:row.message||""});
      if(row.reply){add("it",row.reply);hist.push({role:"assistant",text:row.reply});}
    });
    if(st.repair_preview)
      appendRepairCheckDetails(st.repair_preview);
    if(st.candidate){currentCandidate=st.candidate;appendCandidateMessage(st.candidate,false);}
    appendQuestionnaire(st.terminal);
  }else{
    renderPicker();
  }
  $("ta").focus();
}).catch(function(err){if(opening.parentNode)opening.remove();
  add("it","当前评审恢复失败："+String(err.message||err)+"。你仍可以重新选择一个工作流。");renderPicker();});
})();
</script></body></html>
