<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>差旅规划agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>
:root{
  --ga:#FBF7EC;--gb:#F4EEDA;--surface:#FFFDF7;--s2:#F6F1E2;
  --ink:#1C1813;--ink2:#574F42;--ink3:#7C7364;--rule:#E4DCC7;--rule2:#D2C8AE;
  --acc:#7A5218;--acc2:#97671F;--accs:#F5E9CE;--accl:#D9BE86;--onacc:#FFFDF7;
  --sans:"IBM Plex Sans","Noto Sans SC",-apple-system,"PingFang SC",sans-serif;
  --mono:"IBM Plex Mono","Noto Sans SC",ui-monospace,Menlo,monospace;
  --sh:0 1px 2px rgba(60,45,20,.05),0 10px 26px -18px rgba(60,45,20,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ga:#14110B;--gb:#1A160F;--surface:#1D1913;--s2:#252019;
  --ink:#EDE6D6;--ink2:#B3A995;--ink3:#918878;--rule:#332D23;--rule2:#463E30;
  --acc:#D9AE62;--acc2:#C69B4E;--accs:#2A2115;--accl:#5C4A2C;--onacc:#14110B;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 26px -18px rgba(0,0,0,.8);
}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  background:linear-gradient(155deg,var(--ga) 0%,var(--ga) 38%,var(--gb) 100%)}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:5px}

#app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:0 20px;height:46px;flex-shrink:0;
  border-bottom:1px solid var(--rule)}
.nm{font-size:14px;font-weight:600}
.mn{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.grow{flex:1}

.log{flex:1;overflow-y:auto;min-height:0}
.inner{max-width:720px;margin:0 auto;padding:26px 22px 20px;display:flex;
  flex-direction:column;gap:16px}
.msg{max-width:82%;padding:11px 15px;border-radius:12px;line-height:1.68;
  animation:in .28s cubic-bezier(.2,.9,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;background:var(--accs);border:1px solid var(--accl)}
.msg.it{align-self:flex-start;background:var(--surface);border:1px solid var(--rule);
  box-shadow:var(--sh)}
.act{align-self:flex-start;font-family:var(--mono);font-size:10.5px;color:var(--ink3);
  padding:0 4px}
.empty{text-align:center;color:var(--ink3);padding:70px 0;font-size:13.5px}

.caps{flex-shrink:0;border-top:1px solid var(--rule);background:var(--surface)}
.capsin{max-width:720px;margin:0 auto;padding:11px 22px 0}
.capttl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:7px}
.caplist{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.caplist span{border:1px solid var(--rule2);border-radius:14px;padding:3px 11px;background:var(--ga)}

.foot{flex-shrink:0;background:var(--surface)}
.footin{max-width:720px;margin:0 auto;padding:11px 22px 16px}
.box{display:flex;gap:9px;align-items:flex-end;border:1px solid var(--rule2);border-radius:12px;
  padding:9px 10px 9px 14px;background:var(--ga);transition:border-color .15s,box-shadow .15s}
.box:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
.box textarea{flex:1;border:0;background:transparent;resize:none;outline:none;font-size:14.5px;
  line-height:1.6;min-height:26px;max-height:120px}
.go{width:31px;height:31px;border-radius:8px;background:var(--acc);color:var(--onacc);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.go[disabled]{opacity:.3;cursor:not-allowed}
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink3);
  margin-right:3px;animation:b 1.1s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app">
  <div class="top">
    <span class="nm" id="nm">—</span>
    <span class="mn" id="ver"></span>
    <span class="grow"></span>
    <span class="mn">条件 B · 纯对话</span>
  </div>
  <div class="log" id="log"><div class="inner" id="inner"></div></div>
  <div class="caps"><div class="capsin">
    <div class="capttl">可以让我做这些</div>
    <div class="caplist">
      <span>跑一次任务</span><span>说明它从哪些选项里选的</span>
      <span>检验某条指令是否起作用</span><span>检验某项数据有没有被用到</span>
      <span>记录你的预期</span><span>修改指令</span>
      <span>对比改前改后</span><span>发布 / 暂缓</span>
      <span>列出当前指令</span>
    </div>
  </div></div>
  <div class="foot"><div class="footin">
    <div class="box"><textarea id="ta" rows="1" placeholder="输入…"></textarea>
      <button class="go" id="go">↑</button></div>
  </div></div>
</div>
<script>
(function(){"use strict";
function h(t,a,k){var e=document.createElement(t);
  if(a)for(var n in a){var v=a[n];if(v==null||v===false)continue;
    if(n==="class")e.className=v;else if(n.slice(0,2)==="on")e.addEventListener(n.slice(2),v);
    else e.setAttribute(n,v);}
  (k||[]).forEach(function(c){if(c==null)return;
    e.appendChild(typeof c==="string"?document.createTextNode(c):c);});return e;}
var $=function(i){return document.getElementById(i);};
var hist=[],busy=false;

function add(cls,txt){
  var el=h("div",{class:"msg "+cls},[txt]);
  $("inner").appendChild(el);scroll();return el;}
function note(txt){$("inner").appendChild(h("div",{class:"act"},[txt]));scroll();}
function scroll(){var l=$("log");setTimeout(function(){l.scrollTop=l.scrollHeight;},40);}

var CAPNAME={run_task:"执行任务",show_options:"取出候选项",check_instruction:"检验指令",
  check_data:"检验数据",record_expectation:"记录预期",draft:"起草修改",compare:"对比改前改后",
  decide:"记录决定",list_instructions:"读取指令",none:""};

function send(){
  var ta=$("ta"),txt=(ta.value||"").trim();
  if(!txt||busy)return;
  ta.value="";ta.style.height="auto";
  add("me",txt);hist.push({role:"user",text:txt});
  busy=true;$("go").disabled=true;
  var wait=h("div",{class:"msg it"},[h("span",{class:"dots"},
    [h("span"),h("span"),h("span")])]);
  $("inner").appendChild(wait);scroll();
  fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:txt,history:hist})})
   .then(function(r){
     var rd=r.body.getReader(),dec=new TextDecoder(),buf="";
     return (function pump(){return rd.read().then(function(res){
       if(res.done)return;
       buf+=dec.decode(res.value,{stream:true});
       var ps=buf.split("\n");buf=ps.pop();
       ps.forEach(function(l){if(!l.trim())return;var m;
         try{m=JSON.parse(l);}catch(e){return;}
         if(m.type==="act"){
           var n=CAPNAME[m.capability];
           if(n)wait.previousSibling&&note(n+"…");
         }else if(m.type==="text"){
           if(wait.parentNode)wait.remove();
           add("it",m.text);hist.push({role:"assistant",text:m.text});
         }});
       return pump();});})();
   })
   .catch(function(e){if(wait.parentNode)wait.remove();
     add("it","出错了："+e);})
   .then(function(){busy=false;$("go").disabled=false;$("ta").focus();});
}

$("go").addEventListener("click",send);
$("ta").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
$("ta").addEventListener("input",function(){this.style.height="auto";
  this.style.height=Math.min(120,this.scrollHeight)+"px";});

fetch("/api/state").then(function(r){return r.json();}).then(function(st){
  if(st.skill){$("nm").textContent=st.skill.name;
    $("ver").textContent="v"+st.skill.version;}
  $("inner").appendChild(h("div",{class:"empty"},
    ["描述一个任务，我会用当前的 skill 去执行。"]));
  $("ta").focus();
});
})();
</script></body></html>
