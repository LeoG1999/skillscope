<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillScope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>
:root{
  --ga:#FBF7EC;--gb:#F4EEDA;--surface:#FFFDF7;--s2:#F6F1E2;--s3:#EDE6D3;
  --ink:#1C1813;--ink2:#574F42;--ink3:#7C7364;--rule:#E4DCC7;--rule2:#D2C8AE;
  --acc:#7A5218;--acc2:#97671F;--accs:#F5E9CE;--accl:#D9BE86;--onacc:#FFFDF7;
  --ok:#2C6A44;--oks:#DEEBE1;--okl:#93BBA0;
  --bad:#9E2B20;--bads:#F6E2DC;--badl:#DDA79B;
  --vio:#5B3E86;--vios:#EAE3F4;--viol:#B6A3D3;
  --sans:"IBM Plex Sans","Noto Sans SC",-apple-system,"PingFang SC",sans-serif;
  --disp:"Archivo","Noto Sans SC",var(--sans);
  --mono:"IBM Plex Mono","Noto Sans SC",ui-monospace,Menlo,monospace;
  --sh:0 1px 2px rgba(60,45,20,.05),0 10px 26px -18px rgba(60,45,20,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ga:#14110B;--gb:#1A160F;--surface:#1D1913;--s2:#252019;--s3:#2F2920;
  --ink:#EDE6D6;--ink2:#B3A995;--ink3:#918878;--rule:#332D23;--rule2:#463E30;
  --acc:#D9AE62;--acc2:#C69B4E;--accs:#2A2115;--accl:#5C4A2C;--onacc:#14110B;
  --ok:#7BC095;--oks:#16271C;--okl:#2F5540;
  --bad:#E0897C;--bads:#2C1917;--badl:#5B322C;
  --vio:#B79BDD;--vios:#221B2E;--viol:#453A5C;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 26px -18px rgba(0,0,0,.8);
}}
:root[data-theme=dark]{
  --ga:#14110B;--gb:#1A160F;--surface:#1D1913;--s2:#252019;--s3:#2F2920;
  --ink:#EDE6D6;--ink2:#B3A995;--ink3:#918878;--rule:#332D23;--rule2:#463E30;
  --acc:#D9AE62;--acc2:#C69B4E;--accs:#2A2115;--accl:#5C4A2C;--onacc:#14110B;
  --ok:#7BC095;--oks:#16271C;--okl:#2F5540;
  --bad:#E0897C;--bads:#2C1917;--badl:#5B322C;
  --vio:#B79BDD;--vios:#221B2E;--viol:#453A5C;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 26px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden;
  background:var(--ga)}
#bg{position:fixed;inset:0;z-index:-2;
  background:linear-gradient(155deg,var(--ga) 0%,var(--ga) 38%,var(--gb) 100%)}
#grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.03;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:5px}
svg.ic{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
svg.ic.sm{width:13px;height:13px}

#app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:11px;padding:0 18px;height:44px;flex-shrink:0;
  border-bottom:1px solid var(--rule)}
.logo{font-family:var(--disp);font-weight:600;font-size:14.5px;letter-spacing:-.02em;color:var(--acc)}
.dot{width:3px;height:3px;border-radius:50%;background:var(--rule2)}
.mn{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.grow{flex:1;min-width:0}

/* ---- 任务栏 ---- */
.tasks{display:flex;align-items:center;gap:7px;padding:9px 18px;flex-shrink:0;overflow-x:auto;
  border-bottom:1px solid var(--rule)}
.tb{display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:8px;white-space:nowrap;
  border:1px solid transparent;font-size:12.5px;color:var(--ink2);transition:all .16s}
.tb:hover{background:var(--s2)}
.tb.on{background:var(--surface);border-color:var(--rule2);color:var(--ink);
  font-weight:500;box-shadow:var(--sh)}
.tb .st{width:6px;height:6px;border-radius:50%;background:var(--rule2);flex-shrink:0}
.tb .st.run{background:var(--acc);animation:pl 1.1s ease-in-out infinite}
.tb .st.ok{background:var(--ok)}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}
.tnew{display:flex;align-items:center;gap:6px;padding:6px 13px;border-radius:8px;font-size:12.5px;
  border:1px dashed var(--rule2);color:var(--ink2);transition:all .16s}
.tnew:hover{border-color:var(--acc);color:var(--acc);border-style:solid}

/* ---- 主体 ---- */
.body{display:grid;grid-template-columns:258px minmax(0,1fr);flex:1;min-height:0}
.side{border-right:1px solid var(--rule);overflow-y:auto;padding:15px 12px}
.right{display:flex;flex-direction:column;min-height:0}
.work{flex:1;overflow-y:auto;min-width:0;padding:22px 26px 26px;display:flex;flex-direction:column}
.wrap{max-width:840px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:15px}
.wrap.mid{flex:1;justify-content:center;align-items:center}

/* ---- 输入区 ---- */
.composer{flex-shrink:0;border-top:1px solid var(--rule);padding:13px 26px 17px}
.cin{max-width:840px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;
  border:1px solid var(--rule2);border-radius:12px;padding:10px 10px 10px 15px;
  background:var(--surface);box-shadow:var(--sh);transition:border-color .16s,box-shadow .16s}
.cin:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs),var(--sh)}
.cin textarea{flex:1;border:0;background:transparent;resize:none;outline:none;font-size:14.5px;
  line-height:1.6;min-height:26px;max-height:120px;padding:0}
.go{width:32px;height:32px;border-radius:9px;background:var(--acc);color:var(--onacc);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .14s}
.go:hover{background:var(--acc2)}
.go[disabled]{opacity:.3;cursor:not-allowed}
.go svg{stroke-width:1.8}

/* ---- hero ---- */
.hero{display:flex;flex-direction:column;align-items:center;gap:0;animation:hin .7s cubic-bezier(.2,.8,.3,1)}
@keyframes hin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.hero svg{width:min(310px,44vh);height:min(310px,44vh);overflow:visible}
.hero .ring{fill:none;stroke:var(--rule2);stroke-width:1}
.hero .tick{stroke:var(--rule2);stroke-width:1;stroke-linecap:round}
.hero .blade{stroke:var(--accl);stroke-width:1.15;stroke-linejoin:round;
  transform-origin:100px 100px;animation:bopen .9s cubic-bezier(.2,.85,.3,1) backwards}
@keyframes bopen{from{transform:rotate(22deg) scale(.62);opacity:0}to{transform:none;opacity:1}}
.hero .core{fill:none;stroke:var(--acc);stroke-width:1.5;stroke-linejoin:round}
.hero .spin{transform-origin:100px 100px;animation:hrot 90s linear infinite}
@keyframes hrot{to{transform:rotate(360deg)}}
.hero .glow{fill:var(--acc);opacity:.055}
.hero .node{fill:var(--acc);opacity:.55}

.sh{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink3);font-weight:500;margin:0 0 9px;display:flex;align-items:center;gap:7px}
.sect{margin-bottom:22px}
.ins{display:grid;grid-template-columns:16px minmax(0,1fr);gap:9px;align-items:start;padding:7px 8px;
  border-radius:7px;width:100%;transition:background .14s}
.ins:hover{background:var(--s2)}
.ins.on{background:var(--accs)}
.ins .i{font-family:var(--mono);font-size:10.5px;color:var(--ink3);padding-top:2px}
.ins .x{font-size:12px;line-height:1.5}
.ins .v{display:block;font-family:var(--mono);font-size:9.5px;margin-top:4px;letter-spacing:.02em}
.pm{display:flex;gap:5px;padding:4px 8px 9px 33px}
.skrow{display:grid;grid-template-columns:7px minmax(0,1fr) auto;gap:9px;align-items:center;
  padding:8px 9px;border-radius:8px;width:100%;transition:background .14s}
.skrow:hover{background:var(--s2)}
.skrow.on{background:var(--accs)}
.skrow .bul{width:6px;height:6px;border-radius:50%;background:var(--rule2)}
.skrow.on .bul{background:var(--acc)}
.skrow .nm{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skrow .mt{font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
.iconb{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;
  justify-content:center;color:var(--ink3);transition:all .14s;flex-shrink:0}
.iconb:hover{background:var(--s2);color:var(--acc)}
.nameEdit{width:100%;border:1px solid var(--acc);border-radius:6px;padding:4px 7px;
  background:var(--surface);font-size:12.5px;outline:none}
.chipbtn{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 9px;border-radius:6px;
  border:1px solid var(--rule2);background:var(--surface);transition:all .14s}
.chipbtn:hover{border-color:var(--acc);color:var(--acc)}
.chipbtn[disabled]{opacity:.35;cursor:not-allowed}

.slot{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--sh);
  overflow:hidden}
.slot-h{display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:1px solid var(--rule)}
.slot-h .t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.slot-b{padding:14px 16px}
.fade{animation:fin .34s cubic-bezier(.2,.85,.3,1)}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fadeout{animation:fout .18s ease-in forwards}
@keyframes fout{to{opacity:0;transform:translateY(-4px)}}

.tag{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:4px;white-space:nowrap;
  border:1px solid var(--rule2);color:var(--ink3);background:var(--s2)}
.tag.a{border-color:var(--accl);color:var(--acc);background:var(--accs)}
.tag.g{border-color:var(--okl);color:var(--ok);background:var(--oks)}
.tag.b{border-color:var(--badl);color:var(--bad);background:var(--bads)}
.tag.v{border-color:var(--viol);color:var(--vio);background:var(--vios)}

.step{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;position:relative}
.step .r{position:relative;display:flex;justify-content:center}
.step .ln{position:absolute;top:15px;bottom:-2px;width:1.5px;background:var(--rule2)}
.step:last-child .ln{display:none}
.step .m{width:11px;height:11px;margin-top:4px;z-index:1;border-radius:3px;
  border:1.5px solid var(--rule2);background:var(--surface)}
.step .m.decision{background:var(--accs);border-color:var(--accl);transform:rotate(45deg)}
.step .m.gate{background:var(--vios);border-color:var(--viol)}
.step .m.action{background:var(--oks);border-color:var(--okl);border-radius:50%}
.step .c{padding-bottom:13px;min-width:0}
.step.hl .m{box-shadow:0 0 0 4px var(--accs);border-color:var(--acc)}
.step.hl .s1{color:var(--acc)}
.step.dim{opacity:.4}
.fork{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;position:relative;
  animation:fin .3s cubic-bezier(.2,.85,.3,1)}
.fork .r{position:relative;display:flex;justify-content:center}
.fork .br{position:absolute;left:9px;top:-13px;width:15px;height:22px;
  border-left:1.5px dashed var(--viol);border-bottom:1.5px dashed var(--viol);
  border-bottom-left-radius:9px}
.fork .c{padding:0 0 13px 10px;min-width:0}
.fork .lab{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--vio);
  background:var(--vios);border:1px solid var(--viol);border-radius:6px;padding:3px 9px}
.fork .alt{font-size:12.5px;color:var(--ink2);margin-top:5px}
.cut{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:11.5px;color:var(--vio)}
.cut .ln{width:26px;height:1.5px;background:var(--vio);position:relative;flex-shrink:0}
.cut .ln::after{content:"";position:absolute;right:-1px;top:-3.5px;width:7px;height:7px;
  border-right:1.5px solid var(--vio);border-top:1.5px solid var(--vio);transform:rotate(45deg)}
.infl{display:block;font-family:var(--mono);font-size:9.5px;margin-top:4px;letter-spacing:.02em}
.dotrow{display:flex;align-items:center;gap:0;margin-top:8px}
.dotrow .p{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--rule2);
  background:var(--surface);flex-shrink:0}
.dotrow .p.ok{background:var(--ok);border-color:var(--ok)}
.dotrow .p.no{background:var(--surface);border-color:var(--bad)}
.dotrow .seg{height:1.5px;flex:1;background:var(--rule2);min-width:26px}
.dotrow.broke .seg{background:var(--bad);height:2.5px}
.dotrow.broke .p{border-color:var(--bad)}
.dotrow .cap{font-family:var(--mono);font-size:9.5px;color:var(--ink3);margin-left:9px}
.sitcard{border:1px solid var(--rule);border-radius:10px;padding:11px 13px;margin-bottom:9px;
  background:var(--surface);transition:border-color .16s,box-shadow .16s}
.sitcard.broke{border-color:var(--bad);box-shadow:0 0 0 3px var(--bads)}
.srcrow{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:9px;align-items:center;
  padding:7px 8px;border-radius:7px;width:100%;transition:background .14s}
.srcrow:hover{background:var(--s2)}
.srcrow.on{background:var(--accs)}
.srcrow .nm{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcrow .ct{font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
.srcrow .warn{color:var(--bad)}
.kind{width:9px;height:9px;border-radius:2px;border:1.5px solid var(--rule2);background:var(--surface)}
.kind.data{background:var(--accs);border-color:var(--acc)}
.kind.query{background:var(--surface);border-color:var(--rule2);border-radius:50%}
.kind.write{background:var(--vios);border-color:var(--viol)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3);font-weight:500;padding:6px 8px;
  border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:0;border-bottom:1px solid var(--rule);vertical-align:middle}
.tbl td input{width:100%;border:0;background:transparent;padding:7px 8px;font-size:12px;
  outline:none;font-family:var(--mono);border-radius:5px}
.tbl td input:focus{background:var(--accs);box-shadow:inset 0 0 0 1px var(--acc)}
.tbl tr:hover td{background:var(--s2)}
.tblwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:9px}
.rowdel{width:26px;text-align:center;color:var(--ink3)}
.rowdel:hover{color:var(--bad)}
.empt{text-align:center;padding:26px 10px;color:var(--ink3)}
/* 日历 */
.calhd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.calhd .mo{font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:-.01em}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .wd{font-family:var(--mono);font-size:9.5px;color:var(--ink3);text-align:center;
  padding:4px 0 6px;letter-spacing:.06em}
.cday{position:relative;aspect-ratio:1/1;border-radius:8px;border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:12.5px;color:var(--ink2);transition:all .13s}
.cday:hover{background:var(--s2)}
.cday.out{color:var(--ink3);opacity:.4}
.cday.today{border-color:var(--rule2);font-weight:600;color:var(--ink)}
.cday.on{background:var(--acc);color:var(--onacc);font-weight:600}
.cday .pip{display:flex;gap:2px;height:4px}
.cday .pip i{width:4px;height:4px;border-radius:50%;background:var(--acc)}
.cday.on .pip i{background:var(--onacc)}
.dayhd{display:flex;align-items:baseline;gap:9px;margin:16px 0 9px;
  padding-top:14px;border-top:1px solid var(--rule)}
.dayhd .dt{font-size:14px;font-weight:600}
.evt{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:11px;align-items:center;
  padding:9px 11px;border:1px solid var(--rule);border-radius:9px;margin-bottom:7px;
  background:var(--surface)}
.evt .tm{font-family:var(--mono);font-size:11px;color:var(--acc)}
.evt .tt{font-size:13px}
.evt .lo{font-size:11.5px;color:var(--ink3);margin-top:1px}
.addrow{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:11px;align-items:center;
  padding:9px 11px;border:1px dashed var(--rule2);border-radius:9px;background:var(--s2)}
.addrow input{border:1px solid var(--rule2);border-radius:6px;padding:5px 8px;font-size:12px;
  background:var(--surface);outline:none;width:100%}
.addrow input:focus{border-color:var(--acc);box-shadow:0 0 0 2px var(--accs)}
.tmwrap{display:flex;gap:4px;align-items:center}
.tmwrap input{padding:5px 4px;text-align:center;font-family:var(--mono);font-size:11px}
/* 可选项 */
.optwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:9px}
.opt{width:100%;border-collapse:collapse;font-size:12.5px}
.opt th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3);font-weight:500;padding:7px 10px;
  border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--s2)}
.opt td{padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.opt tr:last-child td{border-bottom:0}
.opt tr.chosen td{background:var(--accs);font-weight:500}
.opt tr.chosen td:first-child{box-shadow:inset 2px 0 0 var(--acc)}
.opt .mark{width:22px;color:var(--acc);text-align:center}
.ctx{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;padding-top:11px;
  border-top:1px dotted var(--rule)}
.ctxi{display:inline-flex;gap:7px;align-items:baseline;font-size:12px;
  border:1px solid var(--rule);border-radius:7px;padding:5px 10px;background:var(--s2)}
.ctxi .t{font-family:var(--mono);font-size:10.5px;color:var(--acc)}
.disp{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.dbtn{font-size:12px;padding:5px 12px;border-radius:7px;border:1px solid var(--rule2);
  background:var(--surface);transition:all .14s}
.dbtn:hover{border-color:var(--acc)}
.dbtn.chg{border-color:var(--okl);color:var(--ok);background:var(--oks)}
.dbtn.pre{border-color:var(--accl);color:var(--acc);background:var(--accs)}
.dbtn.unr{border-color:var(--viol);color:var(--vio);background:var(--vios)}
.qcard{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin-bottom:9px;
  background:var(--surface)}
.qcard .qt{font-size:13px;line-height:1.5}
.qcard .qw{font-size:11.5px;color:var(--ink3);margin-top:3px}
.dchip{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:4px;
  border:1px solid var(--rule2);color:var(--ink3);background:var(--s2)}
.dchip.chg{border-color:var(--okl);color:var(--ok);background:var(--oks)}
.dchip.pre{border-color:var(--accl);color:var(--acc);background:var(--accs)}
.dchip.unr{border-color:var(--viol);color:var(--vio);background:var(--vios)}
.insedit{width:100%;border:1px solid var(--rule2);border-radius:6px;padding:6px 8px;
  background:var(--surface);font-size:12px;line-height:1.5;outline:none;resize:vertical;
  font-family:var(--sans);min-height:52px}
.insedit:focus{border-color:var(--acc);box-shadow:0 0 0 2px var(--accs)}
.vrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:baseline;
  padding:6px 8px;font-size:12px;border-radius:6px}
.vrow:hover{background:var(--s2)}

function decide(action,reason,t){
  var out=(t&&t.compare)?t.compare.rows.filter(function(r){return r.done;}).map(function(r){
    return {expectation:r.commitment,disposition:r.disposition,conflict:!!r.conflict};}):[];
  return post("/api/decide",{action:action,reason:reason,outcome:out});
}
function doDraft(){
  var t=T(),fb=[];
  if(t&&t.compare)fb=t.compare.rows.filter(function(r){return r.done;}).map(function(r){
    return {expectation:r.commitment,disposition:r.disposition,
      result:r.conflict?"failed":"ok"};});
  S.busy=true;render();
  post("/api/draft",{feedback:fb}).then(function(d){S.busy=false;
    if(d.error)return alert(d.error);S.candidate=d.candidate;render();});
}
function compare(){
  var t=T();if(!S.situations.length)return;
  t.busy=true;
  var rows=S.situations.map(function(x){return {commitment:x.commitment,sid:x.sid,
    criterion:x.criterion,disposition:x.disposition||"change",sealed:!!x.sealed,
    before:null,after:null,bsig:null,asig:null,done:false};});
  t.compare={rows:rows,done:false};render();
  var left=rows.length*2;
  rows.forEach(function(r){["base","draft"].forEach(function(w){
    stream("/api/run",{snapshot:r.sid,k:3,criterion:r.criterion,
      variant:w==="draft"?{draft:true}:{}},function(m){
      if(m.type==="done"){
        var s=m.summary,v=s.tot?(s.pass>s.tot/2):null;
        if(w==="base"){r.before=v;r.bsig=s.top;}else{r.after=v;r.asig=s.top;}
        var haveBoth=(r.bsig!=null&&r.asig!=null);
        if(haveBoth){
          r.done=true;
          var moved=(r.bsig!==r.asig);          // 行为是否实质改变
          if(r.disposition==="change")
            r.conflict=(r.criterion?(r.after!==true):!moved);
          else if(r.disposition==="preserve")
            r.conflict=(r.criterion&&r.before!=null&&r.after!=null)
                        ?(r.before===true&&r.after===false):moved;
          else r.conflict=moved;                 // 暂不决定：变了就是被替你定了
          r.moved=moved;
        }
        left--;if(!left){t.compare.done=true;t.busy=false;}render();}});
  });});
}

function fieldMap(rows){
  var keys=[];rows.forEach(function(r){Object.keys(r||{}).forEach(function(k){
    if(keys.indexOf(k)<0)keys.push(k);});});
  function find(){var pats=[].slice.call(arguments);
    for(var i=0;i<pats.length;i++)for(var j=0;j<keys.length;j++)
      if(keys[j].toLowerCase().indexOf(pats[i])>=0)return keys[j];
    return null;}
  return {keys:keys,start:find("start","begin","date","time"),end:find("end","finish"),
    title:find("title","name","subject","summary"),place:find("location","place","where","addr")};
}
function isCalendar(rows){
  if(!rows.length)return false;
  var f=fieldMap(rows);
  if(!f.start)return false;
  var v=rows[0][f.start];
  return typeof v==="string"&&/^\d{4}-\d{2}-\d{2}/.test(v);
}
function ymd(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}

/* ---------- 决策依据：可选项与被选中项 ---------- */
function norm(v){return String(v).trim().toLowerCase().replace(/[\s\-_/]/g,"");}
function pickChosen(items,facts){
  var vals=[];for(var k in (facts||{})){var v=facts[k];
    if(v!=null&&typeof v!=="object")vals.push(norm(v));}
  if(!vals.length||!items.length)return -1;
  // 只用能区分选项的字段：所有选项都相同的值无法指认谁被选中
  var keys={},disc={};
  items.forEach(function(it){for(var k in it){var v=it[k];
    if(v==null||typeof v==="object")return;
    (keys[k]=keys[k]||{})[norm(v)]=1;}});
  for(var k in keys)disc[k]=Object.keys(keys[k]).length>1;
  var best=0,bi=-1;
  items.forEach(function(it,i){
    var sc=0;
    for(var k in it){
      if(!disc[k])continue;
      var v=it[k];if(v==null||typeof v==="object")continue;
      var nv=norm(v);if(nv.length<2)continue;
      for(var j=0;j<vals.length;j++){
        if(vals[j]===nv){sc+=2;break;}
        if(nv.length>=4&&vals[j].indexOf(nv)>=0){sc+=1;break;}
      }
    }
    if(sc>best){best=sc;bi=i;}});
  return best>0?bi:-1;
}
function optionCols(items){
  var keys=[];items.forEach(function(it){Object.keys(it||{}).forEach(function(k){
    if(keys.indexOf(k)<0)keys.push(k);});});
  // 优先展示可比较的字段，其余最多补到 5 列
  var pri=[],rest=[];
  keys.forEach(function(k){
    (/id|no|number|name|price|cost|amount|arriv|depart|time|date|stop|class|airline|merchant|categ/i
      .test(k)?pri:rest).push(k);});
  return pri.concat(rest).slice(0,6);
}
function optionsSlot(t){
  if(!t.snap||!t.workflow)return null;
  var srcByTool={};(S.sources||[]).forEach(function(x){srcByTool[x.tool]=x;});
  var listTool=null,items=null;
  for(var k in t.snap.tools){
    var v=t.snap.tools[k];
    if(Array.isArray(v)&&v.length&&typeof v[0]==="object"
       &&(srcByTool[k]||{}).kind==="query"){listTool=k;items=v;break;}
  }
  if(!items)return null;
  var ci=pickChosen(items,t.workflow.facts);
  var cols=optionCols(items);
  var tb=h("tbody");
  items.forEach(function(it,i){
    var tr=h("tr",{class:i===ci?"chosen":""});
    tr.appendChild(h("td",{class:"mark"},[i===ci?"✓":""]));
    cols.forEach(function(c){
      var v=it[c];
      tr.appendChild(h("td",{},[v==null?"":String(v).replace("T"," ")]));});
    tb.appendChild(tr);});
  var tbl=h("div",{class:"optwrap"},[h("table",{class:"opt"},[
    h("thead",{},[h("tr",{},[h("th",{class:"mark"},[""])].concat(
      cols.map(function(c){return h("th",{},[c]);})))]),tb])]);

  var body=h("div",{},[tbl]);
  // 同时把用户自己的数据摆出来，便于对照判断
  var ctx=h("div",{class:"ctx"});
  Object.keys(t.snap.tools).forEach(function(k){
    if((srcByTool[k]||{}).kind!=="data")return;
    var rows=t.snap.tools[k];
    if(!Array.isArray(rows))return;
    var f=fieldMap(rows);
    rows.slice(0,4).forEach(function(r){
      ctx.appendChild(h("span",{class:"ctxi"},[
        h("span",{class:"t"},[f.start?String(r[f.start]||"").replace("T"," "):""]),
        h("span",{},[f.title?String(r[f.title]||""):JSON.stringify(r).slice(0,26)])]));});
  });
  if(ctx.childNodes.length)body.appendChild(ctx);

  return slot("决策依据","layers",
    h("span",{class:"tag"},[items.length+" 个可选项"+(ci<0?" · 未能定位所选项":"")]),body);
}

function slot(title,iconName,right,body,cls){
  return h("div",{class:"slot fade"+(cls?" "+cls:"")},[
    h("div",{class:"slot-h"},[h("span",{class:"t"},[ic(iconName),title]),
      h("span",{class:"grow"}),right||null]),

function wfBody(run,opts){
  opts=opts||{};
  var box=h("div",{}),hl=opts.highlight,fork=opts.fork,cut=opts.cut;
  (run.steps||[]).forEach(function(st,i){
    var on=hl&&hl.length&&hl.indexOf(i)>=0, off=hl&&hl.length&&!on;
    var row=h("div",{class:"step"+(on?" hl":"")+(off?" dim":"")});
    row.appendChild(h("div",{class:"r"},[h("span",{class:"ln"}),h("span",{class:"m "+(st.kind||"")})]));
    var c=h("div",{class:"c"});
    c.appendChild(h("div",{class:"s1"},[h("span",{},[st.title||""])]));
    if(st.detail)c.appendChild(h("div",{class:"s2"},[st.detail]));
    if(cut&&cut===i)c.appendChild(h("div",{class:"cut"},[h("span",{class:"ln"}),
      h("span",{},["该数据未参与后续决策"])]));
    row.appendChild(c);box.appendChild(row);
  });
  if(run.outcome)box.appendChild(h("div",{style:"font-size:13px;margin-top:3px"},[run.outcome]));
  if(fork&&fork.alt_outcome)box.appendChild(h("div",{class:"fork",style:"margin-top:9px"},[
    h("div",{class:"r"},[h("span",{class:"br"})]),
    h("div",{class:"c"},[h("span",{class:"lab"},[ic("shuffle","sm"),"另一种结果"]),
      h("div",{class:"alt"},[fork.alt_outcome])])]));
  return box;
}

  w.className="wrap";

  if(t.inflNote==="controls")finds.push(["g","该指令影响上方高亮的步骤"]);
  if(t.inflNote==="dead")finds.push(["b","该指令存在，但对结果没有影响"]);
  if(t.inflNote==="unsure")finds.push(["v","行为本身不稳定，证据不足以判定"]);
  if(t.cut===0)finds.push(["b","该数据源未参与决策"]);
  if(finds.length)w.appendChild(slot("发现","dot",null,
    h("div",{style:"display:flex;flex-direction:column;gap:8px"},
      finds.map(function(f){return h("div",{style:"display:flex;gap:9px;align-items:center"},[
        h("span",{class:"tag "+f[0]},["·"]),h("span",{style:"font-size:13.5px"},[f[1]])]);}))));

  if(t.inflRun)w.appendChild(slot("验证中","scale",h("span",{class:"spin"}),
    h("div",{class:"mn"},["指令 "+t.inflRun.n])));
  if(t.cutRun)w.appendChild(slot("验证中","shuffle",h("span",{class:"spin"}),
    h("div",{class:"mn"},["变更一项输入后重新执行"])));

  if(t.crit){
    var body=h("div",{});
    if(t.crit.loading)body.appendChild(h("div",{class:"mn"},[h("span",{class:"spin"})]));
    else if(t.crit.error)body.appendChild(h("div",{class:"err"},[t.crit.error]));
    else{

      t.crit.candidates.forEach(function(c){

        (c.trial||[]).forEach(function(x,i){
          if(i)tr.appendChild(h("span",{class:"seg",style:"max-width:14px;min-width:14px"}));
          tr.appendChild(h("span",{class:"p "+(x===true?"ok":x===false?"no":"")}));});
        tr.appendChild(h("span",{class:"cap"},["基于已有执行"]));
        body.appendChild(h("button",{class:"crit",onclick:function(){chooseCrit(c);}},[
          h("div",{class:"l"},[c.label||""]),tr]));});
    }
    if(t.crit.picked)body.appendChild(h("div",{style:"margin-top:12px;border-top:1px solid var(--rule);padding-top:11px"},[
      h("div",{style:"font-size:13px;font-weight:600;margin-bottom:2px"},["处置方式"]),
      h("div",{class:"disp"},["change","preserve","unresolved"].map(function(k){
        return h("button",{class:"dbtn "+DISP[k].c,onclick:function(){commitSituation(k);}},[DISP[k].t]);}))]));
    w.appendChild(slot("判定标准","check",null,body));
  }

  if(t.contrast){
    var cb=h("div",{});
    if(t.contrast.loading)cb.appendChild(h("div",{class:"mn"},[h("span",{class:"spin"})]));
    else (t.contrast.items||[]).forEach(function(it,ix){
      var card=h("div",{class:"qcard"},[
        h("div",{style:"display:flex;gap:8px;align-items:baseline"},[
          h("div",{class:"qt",style:"flex:1"},[it.text]),
          ix===0?h("span",{class:"sealbadge"},["对起草模型保密"]):null]),
        it.why?h("div",{class:"qw"},[it.why]):null]);
      if(it.done)card.appendChild(h("div",{style:"margin-top:8px"},[
        h("span",{class:"dchip "+DISP[it.done].c},[DISP[it.done].t])]));
      else card.appendChild(h("div",{class:"disp"},["preserve","change","unresolved"].map(function(k){
        return h("button",{class:"dbtn "+DISP[k].c,
          onclick:function(){commitContrast(it,k,ix);}},[DISP[k].t]);})));
      cb.appendChild(card);});
    cb.appendChild(h("div",{style:"margin-top:4px"},[
      h("button",{class:"btn",onclick:function(){t.contrast=null;render();}},["跳过"])]));
    w.appendChild(slot("相关情况","layers",null,cb));
  }

  if(S.candidate){
    var dv=h("div",{class:"diff"}),old=S.skill.instructions;
    S.candidate.instructions.forEach(function(nw,i){
      var o=old[i];
      if(o&&o.text===nw.text)dv.appendChild(h("div",{class:"dl"},[h("span",{class:"n"},[String(nw.n)]),
        h("span",{class:"g"},[""]),h("span",{class:"x"},[nw.text])]));
      else{if(o)dv.appendChild(h("div",{class:"dl d"},[h("span",{class:"n"},[String(o.n)]),
        h("span",{class:"g"},["−"]),h("span",{class:"x"},[o.text])]));
        dv.appendChild(h("div",{class:"dl a"},[h("span",{class:"n"},[String(nw.n)]),
          h("span",{class:"g"},["+"]),h("span",{class:"x"},[nw.text])]));}});
    w.appendChild(slot("修改草稿","edit",
      h("button",{class:"chipbtn",onclick:function(){post("/api/discard",{}).then(refresh);}},["丢弃"]),
      h("div",{},[dv,h("div",{style:"margin-top:12px"},[
        h("button",{class:"btn pri",disabled:t.busy?"":null,onclick:compare},
          [ic("scale"),"验证影响范围"])])])));
  }

  if(t.compare){
    var cf=t.compare.rows.filter(function(r){return r.done&&r.conflict;}).length;
    var rows=h("div",{});
    t.compare.rows.forEach(function(r){
      var dz=DISP[r.disposition]||DISP.change;
      var msg=r.done?(r.conflict

      var dr=h("div",{class:"dotrow"+(r.conflict?" broke":"")},[

/* ---------- 输入 ---------- */
function submit(){
  var ta=$("ta"),txt=(ta.value||"").trim();
  if(!txt)return;
  var t=T();
  if(!t){newTask();t=T();}
  if(S.busy||(t&&t.busy))return;
  ta.value="";ta.style.height="auto";
  if(!t.snap){startTask(txt);return;}
  S.busy=true;render();
  post("/api/intent",{text:txt}).then(function(d){
    S.busy=false;var it=d.intent||"other";
    if(it==="run"){newTask();startTask(d.task||txt);}
    else if(it==="expect")doExpect(d.text||txt);
    else if(it==="probe"&&d.instruction)doProbe("delete",d.instruction);
    else if(it==="edit")doDraft();
    else if(it==="publish")compare();
    else doExpect(txt);
    render();});
}
var SCENES=[
  "UA88 次日旧金山至芝加哥航班取消，需要改签",
  "预订下周三前往西雅图的行程",
  "今晚回程航班延误 3 小时，评估是否改签"];
function sugsFor(){
  var t=T();
  if(!S.skill)return [];
  if(!t||!t.snap)return SCENES;
  var out=[];
  if(t.summary&&!S.situations.length)out.push("结果不符合预期");
  if(t.workflow)out.push("为什么产生这个结果");
  if(S.situations.length&&!S.candidate)out.push("根据预期修改指令");
  if(S.candidate&&!t.compare)out.push("验证影响范围");
  return out;
}
function composerView(){

  c.style.display=S.skill?"":"none";

  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submit();}});

  var r=document.documentElement,c=r.getAttribute("data-theme"),
    d=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;

refresh();
})();
